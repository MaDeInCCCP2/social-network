<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XAM — Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="auth-wrapper">
    <div class="glass-panel auth-card">
        <div class="auth-header">
            <img src="/image/T_Logo_XAM.png" class="brand-logo" alt="XAM Logo">
            <h1 class="auth-title">Создать аккаунт</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alerts">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}" novalidate>
            <div class="input-group">
                <label for="username">Имя пользователя</label>
                <input id="username" name="username" type="text"
                       placeholder="Уникальный логин" required
                       value="{{ request.form.get('username', '') }}">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email"
                       placeholder="Ваша почта" required
                       value="{{ request.form.get('email', '') }}">
            </div>

            <div class="input-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password"
                       placeholder="Мощный пароль" required>
            </div>

            <div class="input-group">
                <label for="confirm">Повторите пароль</label>
                <input id="confirm" name="confirm" type="password"
                       placeholder="Пароль ещё раз" required>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 8px;">Стать частью сети</button>
        </form>

        <p class="auth-footer">
            Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
        </p>
    </div>
</div>
</body>
</html>
