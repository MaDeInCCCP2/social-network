<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XAM — Настройки</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-wrap">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/branding/T_Logo_XAM_Main.png" class="brand-logo" alt="XAM Logo">
            </div>
            <ul class="nav-links">
                <a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">
                    <li class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        XAM-Лента
                    </li>
                </a>
                <a href="{{ url_for('messages') }}" style="text-decoration: none; color: inherit;">
                    <li class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        XAM-Общения
                    </li>
                </a>
                <a href="{{ url_for('friends') }}" style="text-decoration: none; color: inherit;">
                    <li class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        XAM-Друзья
                    </li>
                </a>
                <a href="{{ url_for('settings') }}" style="text-decoration: none; color: inherit;">
                    <li class="nav-item active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="7" r="4"></circle>
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        </svg>
                        XAM-Настройки
                    </li>
                </a>
            </ul>
        </aside>

        <!-- Top Navigation Area -->
        <header class="top-bar">
            <form class="search-bar" action="{{ url_for('search') }}" method="GET">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" name="q" placeholder="Поиск в XAM...">
            </form>
            <div class="user-controls">
                <a href="{{ url_for('logout') }}" class="btn-logout" title="Выход">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>
                <div class="user-profile">
                    <div class="avatar">{{ user.username[0]|upper }}</div>
                    <span style="font-weight: 500;">{{ user.username }}</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="feed" style="max-width: 600px;">
                <div class="glass-panel" style="padding: 32px;">
                    <h3 style="margin-bottom: 24px;">Основная информация</h3>
                    <form action="#" method="POST">
                        <div class="input-group" style="margin-bottom: 20px;">
                            <label>Имя пользователя</label>
                            <input type="text" value="{{ user.username }}" readonly style="opacity: 0.6; cursor: not-allowed;">
                        </div>
                        <div class="input-group" style="margin-bottom: 20px;">
                            <label>Ваш Email</label>
                            <input type="email" value="{{ user.email }}" readonly style="opacity: 0.6; cursor: not-allowed;">
                        </div>
                        
                        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 32px 0;">
                        
                        <h3 style="margin-bottom: 24px;">Изменение пароля</h3>
                        <div class="input-group" style="margin-bottom: 20px;">
                            <label>Старый пароль</label>
                            <input type="password" placeholder="Введите текущий пароль">
                        </div>
                        <div class="input-group" style="margin-bottom: 20px;">
                            <label>Новый пароль</label>
                            <input type="password" placeholder="Придумайте новый пароль">
                        </div>
                        
                        <button type="submit" class="btn-primary" style="margin-top: 12px; width: 100%;">Сохранить изменения</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
