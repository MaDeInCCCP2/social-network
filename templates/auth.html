<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — SocialNet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="auth-card">
    <h1 class="auth-title">Войти</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" novalidate>
        <label for="login_id">Имя пользователя или e-mail</label>
        <input id="login_id" name="login_id" type="text"
               placeholder="username / email" required
               value="{{ request.form.get('login_id', '') }}">

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password"
               placeholder="Ваш пароль" required>

        <div class="remember-row">
            <input id="remember" name="remember" type="checkbox" value="1">
            <label for="remember">Запомнить меня</label>
        </div>

        <button type="submit" class="btn-primary">Войти</button>
    </form>

    <p class="auth-footer">
        Ещё нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
    </p>
</div>
</body>
</html>
