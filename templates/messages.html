<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XAM — Сообщения</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-wrap">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/image/T_Logo_XAM.png" class="brand-logo" alt="XAM Logo">
            </div>
            <ul class="nav-links">
                <a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">
                    <li class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        XAM-Лента
                    </li>
                </a>
                <li class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    XAM-Общения
                </li>
                <li class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    XAM-Друзья
                </li>
                <li class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    XAM-Профиль
                </li>
            </ul>
        </aside>

        <!-- Top Navigation Area -->
        <header class="top-bar">
            <div class="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a0a0ab" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" placeholder="Поиск диалогов...">
            </div>
            <div class="user-controls">
                <a href="{{ url_for('logout') }}" class="btn-primary" style="padding: 8px 16px; font-size: 0.9rem;">Выйти</a>
                <div class="user-profile">
                    <div class="avatar">{{ user.username[0]|upper }}</div>
                    <span style="font-weight: 500;">{{ user.username }}</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="feed">
                <h2 style="margin-bottom: 24px; font-weight: 600; background: var(--gradient-glow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;">Мои переписки</h2>
                
                <div class="glass-panel" style="padding: 32px; text-align: center; color: var(--text-muted); min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 20px; opacity: 0.3;">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    <p style="font-size: 1.1rem;">У вас пока нет активных диалогов</p>
                    <p style="font-size: 0.9rem; margin-top: 8px;">Выберите друга из списка, чтобы начать общение</p>
                    <button class="btn-primary" style="margin-top: 24px; padding: 10px 24px;">Найти друзей</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
